name: Enable GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/enable-pages.yml'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  enable-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Pages from gh-pages branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          BODY='{"source":{"branch":"gh-pages","path":"/"}}'
          CODE=$(curl -sS -L -o /tmp/pages-response.json -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$API" \
            -d "$BODY")

          if [ "$CODE" = "409" ] || [ "$CODE" = "422" ]; then
            CODE2=$(curl -sS -L -o /tmp/pages-response-update.json -w '%{http_code}' \
              -X PUT \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$API" \
              -d "$BODY")
          else
            CODE2="not-needed"
          fi

          {
            echo "POST_HTTP=$CODE"
            echo "PUT_HTTP=$CODE2"
            echo "POST_RESPONSE:"
            cat /tmp/pages-response.json 2>/dev/null || true
            echo
            echo "PUT_RESPONSE:"
            cat /tmp/pages-response-update.json 2>/dev/null || true
          } > pages-enable-result.txt

      - name: Save activation result
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pages-enable-result.txt
          git commit -m 'Record GitHub Pages activation result' || exit 0
          git push origin HEAD:main
