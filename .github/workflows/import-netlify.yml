          while read -r expected path; do
            mkdir -p "$(dirname "$path")"
            echo "Fetching $path"
            curl -fsSL --retry 4 --retry-delay 2 "$BASE/$path" -o "$path"
            actual="$(sha256sum "$path" | awk '{print $1}')"
            if [ "$actual" != "$expected" ]; then
              echo "SHA-256 mismatch for $path" >&2
