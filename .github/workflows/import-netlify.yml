name: Import Breizh Balade V2.2.3

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download exact app files from immutable Netlify deploy
        shell: bash
        env:
          FILES_B64: 
        run: |
          set -euo pipefail
          BASE="https://6a526a8ccf47028c8969b6b9--breizh-balade.netlify.app"
          printf '%s' "$FILES_B64" | base64 -d > /tmp/files.txt
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            mkdir -p "$(dirname "$path")"
            echo "Fetching $path"
            curl -fsSL --retry 5 --retry-delay 2 --connect-timeout 20 "$BASE/$path" -o "$path"
          done < /tmp/files.txt
          test -s index.html
          test -s js/app.js
          test -s service-worker.js

      - name: Commit imported application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish Breizh Balade V2.2.3"
            git push origin HEAD:main
          fi
