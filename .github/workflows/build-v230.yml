name: Build Breizh Balade V2.3.0
on:
  push:
    branches: [v2.3.0-public-fix]
    paths: ['.github/workflows/build-v230.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V2.3.0 migrations
        run: |
          python tools/patch_index.py
          python tools/patch_auth.py
          python tools/patch_app.py
          python tools/patch_misc.py
      - name: Validate JavaScript and manifest
        run: |
          node --check js/app.js
          node --check js/auth-local.js
          node --check js/storage.js
          node --check js/geolocation.js
          node --check js/map.js
          node --check js/tide-credit.js
          node --check service-worker.js
          python -m json.tool manifest.webmanifest >/dev/null
      - name: Validate public release invariants
        run: |
          ! grep -R "479a92fa8d6e995646aff4a4ca7043e5" js index.html
          grep -q "guestDefaultView = 'explore'" js/auth-local.js
          grep -q 'loading="lazy"' js/app.js
          ! grep -q 'preloadPlaceImages();' js/app.js
          grep -q "breizh-balade-v2.3.0-public" service-worker.js
          grep -q 'og:title' index.html
      - name: Commit clean V2.3.0 release
        run: |
          rm -f tools/patch_index.py tools/patch_auth.py tools/patch_app.py tools/patch_misc.py .github/workflows/build-v230.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Breizh Balade V2.3.0 public'
          git push origin HEAD:v2.3.0-public-fix
